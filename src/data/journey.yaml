# The "workbench" on the landing page: one tab per era, oldest first.
#
#   years, title, text      what the tab says
#   projects                project file names (from src/content/projects/, without .mdx) to link
#   models                  3D models (.glb in public/models/) shown in the viewport. With more than
#                           one, small buttons let visitors switch between them.
#     label                 caption shown in the viewport
#     explode: true         adds an "explode" slider that pulls the parts apart
#     tilt                  starting camera height in degrees (default 20)

- years: 2013 – 2021
  title: Hardware & robot design
  text: >-
    LEGO MINDSTORMS for the National Robotics Competition, then VEX Robotics through secondary school
    and junior college. Mechanisms, drivetrains and match strategy, iterated under competition pressure.
  projects: [nrc, vex]
  models:
    - src: /models/vex-tower-takeover.glb
      label: VEX Tower Takeover robot, 2020 national champions (rough rebuild)
      explode: true

- years: 2024 – 2026
  title: Electrical & firmware design
  text: >-
    PCBs, power distribution and firmware for autonomous underwater vehicles at NUS Bumblebee,
    and hardware-accelerated computer vision on an FPGA.
  projects: [full-electrical-stack-auv5, object-tracker-fpga, mini-auv-robosub-2025]
  models:
    - src: /models/auv5-electrical-stack.glb
      label: AUV 5.0 electrical stack
      explode: true
    - src: /models/fpga-object-tracker.glb
      label: FPGA object tracker with pan-tilt camera
      explode: true

- years: 2026 – now
  title: Robotics software & embodied AI
  text: >-
    Manipulation and tactile sensing for robot foundation models, on a dual-arm Kinova Gen3 rig.
  projects: [embodied-ai-contact-rich-manipulation]
  models:
    - src: /models/kinova-dual-arm.glb
      label: Dual Kinova Gen3 arms, Robotiq 2F-85 grippers, LUCID camera mount
      tilt: 12
