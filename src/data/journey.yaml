# The 3D showcase on the landing page, oldest first. All models stand in one row in this order; the
# timeline under the viewer runs from the first model's year to "now", one stop per model. The
# showcase opens on the last (newest) model.
#
#   src            3D model (.glb in public/models/)
#   label          name shown under the timeline
#   project        project file name (from src/content/projects/, without .mdx). Adds a link to it,
#                  and its subtitle and date are used when `text` / `date` are left out
#   text           (optional) description of the model, shown under the timeline
#   date           (optional) when, e.g. 2020 or May 2025 – Aug 2025
#   explode: true  adds an "explode" slider that pulls the parts apart
#   spin           parts whose name starts with this keep spinning (e.g. thruster rotors)
#   tilt           starting camera height in degrees (default 20)

# Rebuilt from the WRO "Precision Farming" run video with real LEGO parts (npm run model:lego).
- src: /models/lego-ev3-robot.glb
  label: LEGO MINDSTORMS EV3 robot, National Robotics Competition
  project: nrc

- src: /models/vex-tower-takeover.glb
  label: VEX Tower Takeover robot, 2020 national champions
  project: vex
  date: 2020

# From the SOLIDWORKS export, re-assembled by scripts/fix-miniauv.mjs (see MAINTAINING.md).
- src: /models/mini-auv.glb
  label: Mini-AUV, RoboSub 2025
  project: mini-auv-robosub-2025
  spin: rotor_

- src: /models/fpga-object-tracker.glb
  label: FPGA object tracker with pan-tilt camera
  project: object-tracker-fpga

- src: /models/auv5-electrical-stack.glb
  label: AUV 5.0 electrical stack
  project: full-electrical-stack-auv5
  explode: true

- src: /models/auv5.glb
  label: AUV 5.0, RoboSub 2026 champions
  project: full-electrical-stack-auv5
  # From experience.yaml (AUV Lead). TODO(Kenneth): reword if you like
  text: Development lead for AUV 5.0, Bumblebee's newest AUV, which won RoboSub 2026.
  date: 2026
  spin: rotor_

- src: /models/kinova-dual-arm.glb
  label: Dual Kinova Gen3 arms, Robotiq 2F-85 grippers, LUCID camera mount
  project: embodied-ai-contact-rich-manipulation
  tilt: 12
